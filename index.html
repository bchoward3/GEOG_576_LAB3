<!DOCTYPE html>
<html lang="en">
  <head>
    <title>GEOG 576: LAB 3</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <!--ESRI calls-->
    <link rel="stylesheet" href="https://js.arcgis.com/4.25/esri/themes/dark/main.css">
    <script src="https://js.arcgis.com/4.25/"></script>
    <style>
      html, body, #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
    </style>
    <script>
  require([
    "esri/config",
    "esri/Map",
    "esri/views/MapView",
    "esri/widgets/BasemapGallery",
    "esri/widgets/Locate",
    "esri/Graphic",
    "esri/widgets/Search",
    "esri/layers/GraphicsLayer" ,
    "esri/symbols/SimpleMarkerSymbol",
    "esri/geometry/Polyline",
    "esri/layers/FeatureLayer",
    "esri/widgets/Editor",
    "esri/widgets/Expand",
    "esri/widgets/Legend"

  ], function(esriConfig, Map, MapView, BasemapGallery, Locate, Graphic, Search, GraphicsLayer, SimpleMarkerSymbol, Polyline, FeatureLayer, Editor, Expand, Legend) {

    esriConfig.apiKey = "AAPTazVmijAZJOjPyl5hCMPDqAA..zs1UyCs6v5nYRp3ZLCrSdJOsU9zc1sFBjXYsgR9WZUMyR55XSkc3kkwwSVYP_eE28kwGrEVlKcTsFjjRmQ1zv1AK99gVXuateIyat5P_13Ly8TIpkWfc4hFsjJ3n865y_niBHTqRPUHJGuyUTOiK3uyifmZ5tSMqvittvIizKFNHVErA_SdsGBEIihl3ptOrvvOIW4jlcqoCmIewexn5JDyToQEwHy0PtJJ3PgbOtGKo_UHWa2LkyLOpS3UdYCVW71kW5mk.AT1_l2BfxoE2";

    const map = new Map({
      basemap: "topo-vector"
    });

    const view = new MapView({
      map: map,
      center: [-81.1329, 32.0043],
      zoom: 11,
      container: "viewDiv"
    });

    //Adding the basemap Gallery per the documentation
    const basemapGallery = new BasemapGallery({
      view: view
    });
    // view.ui.add(basemapGallery, {
      // position: "top-right"
    // });

    //Adding locate widget per the documentation along with the graphic marker
    const locateWidget = new Locate({
      view: view,
      graphic: new Graphic({
        symbol: { type: "simple-marker" }
      })
    });
    view.ui.add(locateWidget, "top-left");

    //Adding the search widget per the documentation
    const searchWidget = new Search({
    view: view
    });
    // Adds the search widget below other elements in the top left corner of the view
    view.ui.add(searchWidget, {
      position: "top-left",
    });

    const graphicsLayer = new GraphicsLayer();
    map.add(graphicsLayer);

    const point = { //Create a point  
      type: "point",  
      longitude: -81.0953898,    //Forsyth Park
      latitude: 32.0674305
    };

    const simpleMarkerSymbol = new SimpleMarkerSymbol ({
      style: "triangle",
      color: [0, 128, 0],  // 
      outline: {  
        color: [255, 255, 255], // White  
        width: 3
      }
    });

    //creating the pop-up attributes for Forsyth Park
    const popupTemplate = {
    title: "{Name}",
    content: "{Description}"
    }
    const attributes = {
        Name: "Forsyth Park",
        Description: "Setting for the park bench scenes in Forrest Gump."
    }

    // Creating the point
    const pointGraphic = new Graphic({  
      geometry: point,  
      symbol: simpleMarkerSymbol,

      attributes: attributes,
      popupTemplate: popupTemplate
    });
    graphicsLayer.add(pointGraphic);

    //create polyline for W Bay St in Savannah (what passes for Main St here)
    const polyline = new Polyline({
      paths: [
        [
          [-81.1021873, 32.0837620],
          [-81.0965637, 32.0823280],
          [-81.0827593, 32.0786699]
        ]
      ]
    });

    // Creating the line symbol (red line)
    const simpleLineSymbol = {
      type: "simple-line",
      color: [255, 0, 0],
      width: 2
    };

    // I copied the same concept from the point pop up for this pop up. 
    const polylineAttributes = {
      Name: "W Bay ST",
      Description: "Main Street equivalent for Savannah."
    };

    const polylinePopupTemplate = {
      title: "{Name}",
      content: "{Description}"
    };


    // Creating graphic for the line
    const polylineGraphic = new Graphic({
      geometry: polyline,
      symbol: simpleLineSymbol,
      attributes: polylineAttributes,      // ✅ add this
      popupTemplate: polylinePopupTemplate  // ✅ add this
    });

    


  // Add it to the layer
  graphicsLayer.add(polylineGraphic);

    // Define the polygon geometry (roughly Hunter Army Airfield)
    const polygon = {
      type: "polygon",
      rings: [
        [-81.1690196, 32.0133738],
        [-81.1411186, 32.0275405],
        [-81.1225448, 32.0124473],
        [-81.1403532, 32.0027872],
        [-81.1690196, 32.0133738]  // close the ring by repeating the first point
      ]
    };

    // Fill color
    const simpleFillSymbol = {
      type: "simple-fill",
      color: [0, 0, 255, 0.3],
      outline: {
        color: [0, 0, 255],
        width: 1
      }
    };

    // I copied the same concept from the point pop up for this pop up. 
    const polygonAttributes = {
      Name: "Hunter Army Airfiled",
      Description: "Military installation in Savannah."
    };

    const polygonPopupTemplate = {
      title: "{Name}",
      content: "{Description}"
    };

    // Add the polygon
    const polygonGraphic = new Graphic({
      geometry: polygon,
      symbol: simpleFillSymbol,
      attributes: polygonAttributes,
      popupTemplate: polygonPopupTemplate,
    });

  graphicsLayer.add(polygonGraphic);

    // Creating the pop up layer and adding several fields for the pop up (hospital name, city/town and telephone number)
    const popuppolygon = {
      "title": "Hospitals",
      "content": "<b>Name:</b> {USER_Facility_Name}<br><b>City or town:</b> {USER_City_Town}<br><b>Facility phone number:</b> {USER_Telephone_Number}<br>"
    }

    const hospitalRenderer = {
        "type": "simple",
        "symbol": {
          "type": "picture-marker",
          // Hospital icon attributed to Icon Packs (https://www.iconpacks.net/free-icon/airport-location-2959.html)
          "url": "https://raw.githubusercontent.com/bchoward3/GEOG_576_LAB2/main/hospital1.png",
          "width": "18px",
          "height": "18px"
        }
      }

    //Adding the hospitals feature layer
    const featurelayer = new FeatureLayer ({
      url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/Medicare_Hospitals/FeatureServer",
      renderer: hospitalRenderer,
      // Adding the pop up 
      outFields: ["USER_Facility_Name","USER_City_Town","USER_Telephone_Number"],
      popupTemplate: popuppolygon,
    });
    //Add hospitals feature layer to map
  map.add(featurelayer);

    // Creating the pop up layer and adding several fields for the pop up (airport type, city/town and telephone number)
    const popuppolygon2 = {
      "title": "Airports",
      "content": "<b>Facility type:</b> {Fac_Type}<br><b>City:</b> {City}<br><b>Owner phone number:</b> {Owner_Phon}<br>"
    }
    // Airport renderer added per lesson documntation
    const airportRenderer = {
        "type": "simple",
        "symbol": {
          "type": "picture-marker",
          // Airport icon attributed to Icon Packs (https://www.iconpacks.net/free-icon/hospital-location-pin-10718.html)
          "url": "https://raw.githubusercontent.com/bchoward3/GEOG_576_LAB2/main/airport1.png",
          "width": "18px",
          "height": "18px"
        }
      }

    //const to make the airport labels
    const airportLabels = {
      symbol: {
        type: "text",
        color: "#FFFFFF",
        haloColor: "#0000FF",
        haloSize: "2px",
        font: {
          size: "12px",
          family: "Noto Sans",
          style: "italic",
          weight: "normal"
        }
      },
      labelPlacement: "above-center",
      labelExpressionInfo: {
        expression: "$feature.Fac_Name"
      }
    };
    //Adding the airports feature layer
    const featurelayer2 = new FeatureLayer ({
      url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Airports3212/FeatureServer",
      renderer: airportRenderer,
      definitionExpression: "Fac_Type = 'AIRPORT'", //adding sql to filter for airports per lesson instructions
      labelingInfo: [airportLabels], //adding the labels per lesson instructions
      // Adding the pop up 
      outFields: ["Fac_Type","City","Owner_Phon"],
      popupTemplate: popuppolygon2,
    });
    
    //Add feature layer to map
  map.add(featurelayer2);

    // Creating the pop up layer and adding several fields for the pop up (heliport type, city/town and telephone number)
    const popuppolygon3 = {
      "title": "Heliports",
      "content": "<b>Facility type:</b> {Fac_Type}<br><b>City:</b> {City}<br><b>Owner phone number:</b> {Owner_Phon}<br>"
    }
    // Heliport renderer added per lesson documntation
    const heliportRenderer = {
        "type": "simple",
        "symbol": {
          "type": "picture-marker",
          // Airport icon attributed to PNG Tree (https://pngtree.com/so/helipad-icon)
          "url": "https://raw.githubusercontent.com/bchoward3/GEOG_576_LAB2/main/heliport.png",
          "width": "18px",
          "height": "18px"
        }
      }

    //const to make the heliport labels
    const heliportLabels = {
      symbol: {
        type: "text",
        color: "#FFFFFF",
        haloColor: "#FF0000",
        haloSize: "2px",
        font: {
          size: "12px",
          family: "Noto Sans",
          style: "italic",
          weight: "normal"
        }
      },
      labelPlacement: "above-center",
      labelExpressionInfo: {
        expression: "$feature.Fac_Name"
      }
    };
    //Adding the heliports feature layer
    const featurelayer3 = new FeatureLayer ({
      url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/Airports3212/FeatureServer",
      renderer: heliportRenderer,
      definitionExpression: "Fac_Type = 'HELIPORT'", //adding sql to filter for airports per lesson instructions
      labelingInfo: [heliportLabels], //adding the labels per lesson instructions
      // Adding the pop up 
      outFields: ["Fac_Type","City","Owner_Phon"],
      popupTemplate: popuppolygon3,
    });
    
    //Add heliport feature layer to map
  map.add(featurelayer3);

    // Picture marker symbol using GitHub hosted icon
    const myairportSymbol = {
      type: "picture-marker",
      // Airplane icon from Noun Project - attribute to MHDK
      url: "https://raw.githubusercontent.com/bchoward3/GEOG_576_LAB3/refs/heads/main/myairplane.png",
      width: "18px",
      height: "18px"
    };

    const myairportRenderer = {
      type: "simple",
      symbol: myairportSymbol
    };

    // Constructing labels per the LabelClass documentation
    const myAirportLabels = {
      symbol: {
        type: "text",
        color: "orange",
        haloColor: "black",
        haloSize: 1,
        font: {
          family: "Ubuntu Mono",
          size: 14,
          weight: "bold"
        }
      },
      labelPlacement: "above-center",
      labelExpressionInfo: {
        expression: "$feature.AirportCode"
    }
    };
    
    //Adding the MyAirports0386 feature layer
    const featurelayer4 = new FeatureLayer ({
        url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/MyAirports0386/FeatureServer",
        // adding pop-up
        outFields: ["AirportCode"],
        renderer: myairportRenderer,
        labelingInfo: [myAirportLabels]
    });
        // Add feature layer to map
        map.add(featurelayer4);

        // Set point layer's LayerInfo
        const pointInfos = {
          layer: featurelayer4
        };

    // Editor constructor per lesson documentation
    const editor = new Editor ({
      view: view,
      layerInfos: [pointInfos]
    });        

    // Constructing the Expand widget for the editor to conserve screen space
    const editorExpand = new Expand({
      view: view,
      content: editor,
      expandIcon: "pencil",
      group: "primary"
    });
    view.ui.add(editorExpand, "top-right");

    // Challenge 3: wrap basemap gallery
    const basemapExpand = new Expand({
      view: view,
      content: basemapGallery,
      expandIcon: "basemap",
      group: "primary"
    });
    view.ui.add(basemapExpand, "top-right");

    // legend added per documentation to lower left side of map
    const legend = new Legend({
      view: view
    });

    view.ui.add(legend, "bottom-left");

    
  });
  </script>
  </head>
  <body>
    <h1>Hello again GEOG 576! This is Lab 3.</h1>
    <div id="viewDiv"></div>
  </body>
</html>
